# جایگزین فایل قبلی در .github/workflows/build-ticketino-split.yml شود.
# جدیدترین ZIP دارای سورس اندروید با ترتیب تغییرات Git انتخاب می‌شود.
# موفقیت: فقط یک APK مستقیم. شکست: فقط یک فایل لاگ.
name: Build Ticketino SMS APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'
      - '**/*.ZIP'
      - '**/android/**'
      - 'app/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - '.github/workflows/build-ticketino-split.yml'

permissions:
  contents: read

concurrency:
  group: ticketino-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Initialize build log
        run: |
          mkdir -p "$RUNNER_TEMP/ticketino-output"
          : > "$RUNNER_TEMP/Ticketino-Build.log"

      - name: Checkout source and ZIP history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select latest Android source ZIP
        run: |
          python3 - <<'PY' >> "$RUNNER_TEMP/Ticketino-Build.log" 2>&1
          import os, pathlib, re, stat, subprocess, tempfile, zipfile

          root = pathlib.Path.cwd()
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root, stderr=subprocess.DEVNULL)
          tracked = git('ls-files', '-z').decode('utf-8', 'surrogateescape').split('\0')
          archives = [root / p for p in tracked if p and pathlib.Path(p).suffix.lower() == '.zip' and (root / p).is_file()]
          history = git('rev-list', '--date-order', 'HEAD').decode().splitlines()
          ranks = {commit: rank for rank, commit in enumerate(history)}
          def version_key(path):
              return tuple((1, int(piece)) if piece.isdigit() else (0, piece.casefold())
                           for piece in re.split(r'(\d+)', path.as_posix()))
          archives.sort(key=version_key, reverse=True)
          def change_rank(path):
              commit = git('log', '-1', '--format=%H', '--diff-filter=AMR', '--', path.relative_to(root).as_posix()).decode().strip()
              return ranks.get(commit, len(history))
          archives.sort(key=change_rank)

          android = None
          selected = None
          for archive in archives:
              try:
                  with zipfile.ZipFile(archive) as z:
                      entries = {pathlib.PurePosixPath(name).as_posix() for name in z.namelist()}
                      projects = []
                      for name in entries:
                          p = pathlib.PurePosixPath(name)
                          if p.name in ('build.gradle', 'build.gradle.kts') and p.parent.name == 'app':
                              project = p.parent.parent
                              if (project / 'app/src/main/AndroidManifest.xml').as_posix() in entries:
                                  projects.append(project)
                      projects = sorted(set(projects))
                      if not projects:
                          print('Ignoring non-Android ZIP:', archive.relative_to(root))
                          continue
                      if len(projects) != 1:
                          raise SystemExit('The latest Android ZIP must contain exactly one app project: ' + str(archive.relative_to(root)))
                      total = 0
                      seen = set()
                      for member in z.infolist():
                          p = pathlib.PurePosixPath(member.filename)
                          if (p.is_absolute() or '..' in p.parts or '\\' in member.filename
                              or any(ord(c) < 32 for c in member.filename)
                              or (p.parts and ':' in p.parts[0])
                              or stat.S_ISLNK(member.external_attr >> 16)):
                              raise SystemExit('Unsafe ZIP entry: ' + repr(member.filename))
                          normalized = p.as_posix()
                          if normalized in seen:
                              raise SystemExit('Duplicate ZIP entry: ' + repr(member.filename))
                          seen.add(normalized)
                          total += member.file_size
                      if total > 2 * 1024 ** 3:
                          raise SystemExit('Source ZIP exceeds 2 GiB after extraction.')
                      broken = z.testzip()
                      if broken:
                          raise SystemExit('ZIP checksum failed: ' + repr(broken))
                      target = pathlib.Path(tempfile.mkdtemp(prefix='ticketino-source-', dir=os.environ['RUNNER_TEMP']))
                      z.extractall(target)
                      android = target.joinpath(*projects[0].parts)
                      selected = archive.relative_to(root).as_posix()
                      break
              except zipfile.BadZipFile:
                  raise SystemExit('Invalid ZIP; replace or remove this file: ' + str(archive.relative_to(root)))

          if android is None:
              for candidate in (root / 'android', root, root / 'ticketino/android'):
                  if ((candidate / 'app/build.gradle').is_file() or (candidate / 'app/build.gradle.kts').is_file()) and (candidate / 'app/src/main/AndroidManifest.xml').is_file():
                      android = candidate
                      selected = 'direct source: ' + candidate.relative_to(root).as_posix()
                      break
          if android is None:
              raise SystemExit('No Android source found. Upload the Android source ZIP to this repository.')
          for stem in ('build.gradle', 'settings.gradle'):
              if not (android / stem).is_file() and not (android / (stem + '.kts')).is_file():
                  raise SystemExit('Missing Android project file: ' + stem)
          if any(ord(c) < 32 for c in str(android)):
              raise SystemExit('Invalid source directory name.')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('TICKETINO_ANDROID_DIR=' + str(android) + '\n')
          print('Selected source:', selected)
          print('Android directory:', android)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install required Android SDK
        run: |
          for attempt in 1 2 3; do
            if sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >> "$RUNNER_TEMP/Ticketino-Build.log" 2>&1; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              tail -n 80 "$RUNNER_TEMP/Ticketino-Build.log"
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          python3 - <<'PY' >> "$RUNNER_TEMP/Ticketino-Build.log" 2>&1
          import os, pathlib
          sdk = os.environ.get('ANDROID_SDK_ROOT') or os.environ.get('ANDROID_HOME')
          if not sdk:
              raise SystemExit('Android SDK directory is not configured.')
          project = pathlib.Path(os.environ['TICKETINO_ANDROID_DIR'])
          (project / 'local.properties').write_text('sdk.dir=' + sdk.replace('\\', '\\\\').replace(':', '\\:') + '\n')
          PY

      - name: Set up compatible Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
          cache-cleanup: on-success
          add-job-summary: never
          add-job-summary-as-pr-comment: never

      - name: Prepare optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY' >> "$RUNNER_TEMP/Ticketino-Build.log" 2>&1
          import base64, os, pathlib
          variables = ('KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')
          supplied = [bool(os.environ.get(name)) for name in variables]
          if any(supplied) and not all(supplied):
              raise SystemExit('Set all four Android signing secrets, or remove them all to build the installable debug APK.')
          mode = 'debug'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              if all(supplied):
                  try:
                      data = base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split()), validate=True)
                  except ValueError:
                      raise SystemExit('ANDROID_KEYSTORE_BASE64 is not valid base64.')
                  path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ticketino.jks'
                  path.write_bytes(data)
                  path.chmod(0o600)
                  f.write('ANDROID_KEYSTORE_PATH=' + str(path) + '\n')
                  mode = 'release'
              f.write('TICKETINO_BUILD_MODE=' + mode + '\n')
          print('APK build mode:', mode)
          PY
          if [ -n "$KEYSTORE_BASE64" ]; then
            keytool -list -keystore "$RUNNER_TEMP/ticketino.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >> "$RUNNER_TEMP/Ticketino-Build.log" 2>&1
          fi

      - name: Build and check one APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd "$TICKETINO_ANDROID_DIR"
          if [ "$TICKETINO_BUILD_MODE" = release ]; then
            tasks=(':app:assembleRelease' ':app:lintRelease')
          else
            tasks=(':app:assembleDebug' ':app:lintDebug')
          fi
          for attempt in 1 2 3; do
            if gradle --no-daemon --console=plain --stacktrace --max-workers=2 "${tasks[@]}" > "$RUNNER_TEMP/ticketino-attempt.log" 2>&1; then
              cat "$RUNNER_TEMP/ticketino-attempt.log" >> "$RUNNER_TEMP/Ticketino-Build.log"
              break
            else
              build_status=$?
            fi
            cat "$RUNNER_TEMP/ticketino-attempt.log" >> "$RUNNER_TEMP/Ticketino-Build.log"
            if [ "$attempt" -eq 3 ] || ! grep -Eqi 'Could not GET|Could not HEAD|Read timed out|Connect timed out|Connection timed out|Connection reset|502 Bad Gateway|503 Service Unavailable|Temporary failure in name resolution|UnknownHostException|SSL peer shut down' "$RUNNER_TEMP/ticketino-attempt.log"; then
              tail -n 100 "$RUNNER_TEMP/ticketino-attempt.log"
              exit "$build_status"
            fi
            sleep "$((attempt * 5))"
          done
          python3 - <<'PY' >> "$RUNNER_TEMP/Ticketino-Build.log" 2>&1
          import os, pathlib, shutil, zipfile
          mode = os.environ['TICKETINO_BUILD_MODE']
          output = pathlib.Path('app/build/outputs/apk') / mode
          candidates = [p for p in output.rglob('*.apk') if not p.name.endswith('-unsigned.apk')]
          if len(candidates) != 1:
              raise SystemExit('Expected one signed APK; found ' + str(len(candidates)))
          apk = candidates[0]
          with zipfile.ZipFile(apk) as z:
              if z.testzip() or not {'AndroidManifest.xml', 'classes.dex'}.issubset(z.namelist()):
                  raise SystemExit('Built APK is incomplete or corrupt.')
          final = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ticketino-output/Ticketino-SMSBridge.apk'
          shutil.copyfile(apk, final)
          print('Final APK:', final.name, 'bytes:', final.stat().st_size)
          PY
          sdk_dir="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          "$sdk_dir/build-tools/35.0.0/apksigner" verify "$RUNNER_TEMP/ticketino-output/Ticketino-SMSBridge.apk" >> "$RUNNER_TEMP/Ticketino-Build.log" 2>&1

      - name: Upload only the final APK
        id: apk_upload
        if: success()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/ticketino-output/Ticketino-SMSBridge.apk
          archive: false
          if-no-files-found: error
          overwrite: true

      - name: Complete failure log
        if: ${{ failure() && steps.apk_upload.outcome != 'success' }}
        run: |
          printf '\nFull run diagnostics: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/Ticketino-Build.log"

      - name: Upload only the failure log
        if: ${{ failure() && steps.apk_upload.outcome != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/Ticketino-Build.log
          archive: false
          if-no-files-found: ignore
          overwrite: true
